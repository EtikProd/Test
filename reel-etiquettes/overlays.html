<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;font-weight:600;src:url(fonts/cairo-1.ttf)}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-2.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:Cairo,sans-serif}
.o{width:1080px;height:1920px;position:relative;margin-bottom:10px}
.chip{position:absolute;left:60px;right:60px;background:rgba(10,48,0,.88);color:#fff;border-radius:40px;padding:34px 44px;text-align:center;border:4px solid #c8f169}
.chip b{display:block;font-size:76px;font-weight:800;line-height:1.35}
.chip small{display:block;font-size:38px;font-weight:600;opacity:.85;direction:ltr;margin-top:8px}
.brand{position:absolute;top:70px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:40px;text-shadow:0 2px 12px #000}
.cta{position:absolute;left:50px;right:50px;bottom:170px;background:#c8f169;color:#0a3000;border-radius:44px;padding:36px 30px;text-align:center}
.cta b{display:block;font-size:62px;font-weight:800;line-height:1.35}
.cta span{display:block;font-size:74px;font-weight:800;direction:ltr;margin-top:6px}
.cta small{display:block;font-size:36px;font-weight:600;margin-top:4px}
</style></head><body>
<div class="o" id="o1"><div class="brand">EtikProd Al-Djazaïr</div>
 <div class="chip" style="top:250px"><b>هكا تتصنع الإتيكيت تاعك 🏷️</b><small>De l'impression à l'étiquette finie</small></div></div>
<div class="o" id="o2"><div class="brand">EtikProd Al-Djazaïr</div>
 <div class="chip" style="top:250px"><b>طباعة بجودة عالية</b><small>Couleurs nettes · QR code · code-barres</small></div></div>
<div class="o" id="o3">
 <div class="cta"><b>ابعثلنا الطول × العرض والكمية</b><small>WhatsApp</small><span>+213 552 71 85 23</span></div></div>
</body></html>
